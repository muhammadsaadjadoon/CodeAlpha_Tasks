services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inflect
      POSTGRES_USER: inflect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - inflect_postgres:/var/lib/postgresql/data
  backend:
    build: ./backend
    env_file: .env
    depends_on: [db]
    volumes:
      - ./models:/app/models:ro
  frontend:
    build: ./frontend
    ports: ["80:80"]
    depends_on: [backend]
volumes:
  inflect_postgres:
