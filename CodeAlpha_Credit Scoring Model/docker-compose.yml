services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/credora.db
      - CORS_ORIGINS=http://localhost:5173,http://localhost:8080,http://127.0.0.1:5173
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
